kind = "app"
name = "RAWmakase"
summary = "Free Lightroom alternative"
categories = ["Graphics", "Photography"]
icon = "packaging/rawmakase.svg"
screenshots = ["docs/screen.png", "https://example.com/extra.png"]
terminal = false

[linux.x86_64]
asset = "rawmakase-{version}-x86_64-linux.tar.gz"
exec = "usr/bin/rawmakase"

[linux.aarch64]
asset = "rawmakase-{version}-aarch64-linux.tar.gz"
exec = "usr/bin/rawmakase"
