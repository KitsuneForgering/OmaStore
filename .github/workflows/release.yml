name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # publicar a release
  id-token: write      # attestation de proveniência
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # A tag entra por variável de ambiente, nunca interpolada no script.
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Validar a tag
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "tag inválida: $VERSION" >&2
            exit 1
          fi

      - name: Dependências
        run: pacman -Syu --noconfirm --needed base-devel git go cmake ninja qt6-base qt6-declarative qt6-svg

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Testes do backend
        run: make check

      - name: Tarball reprodutível
        run: make dist VERSION="$VERSION"

      - name: Testes do frontend (build de release)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir frontend/build-release --output-on-failure

      - name: Proveniência (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: PKGBUILD do omastore-bin
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "make pkgbuild-bin VERSION=$VERSION"

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            packaging/arch-bin/PKGBUILD
