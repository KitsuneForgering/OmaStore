name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # publish the release
  id-token: write      # provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    # A fixed Arch snapshot (2026-03-15: Go 1.26, Qt 6.10.2), not the rolling
    # archlinux:latest. The shipped omastore-gui must run on systems with an
    # older Qt than the build's: the floor is enforced by `make check-qt-floor`
    # below. Bump the snapshot and QT_FLOOR only deliberately.
    container:
      image: archlinux:base-20260315.0.500537
    env:
      # The tag comes in through an environment variable, never interpolated into the script.
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Validate the tag
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "invalid tag: $VERSION" >&2
            exit 1
          fi

      # Live mirrors would upgrade the pinned Qt again, so point pacman at the
      # Arch Linux Archive for the snapshot's own date.
      - name: Dependencies
        run: |
          printf 'Server=https://archive.archlinux.org/repos/2026/03/15/$repo/os/$arch\n' >/etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed base-devel git go cmake ninja qt6-base qt6-declarative qt6-svg qt6-tools

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Unprivileged user: install.sh refuses to run as root (test-installer) and makepkg too.
      - name: Build user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Backend tests
        run: su builder -c "make check"

      - name: Reproducible tarball
        run: make dist VERSION="$VERSION"

      - name: Frontend tests (release build)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir frontend/build-release --output-on-failure

      - name: Qt symbol floor
        run: make check-qt-floor GUI_BIN=frontend/build-release/omastore-gui

      - name: Provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: omastore-bin PKGBUILD
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "make pkgbuild-bin VERSION=$VERSION"

      - name: Prepare draft release
        uses: softprops/action-gh-release@v3
        with:
          # CI also runs on tag pushes. Keep the assets private until its
          # checks and this workflow pass for the exact tagged commit.
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            packaging/arch-bin/PKGBUILD
            packaging/install.sh
