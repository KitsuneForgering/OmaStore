name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make check
      # Without -race the timing changes, and it has already exposed bugs that -race hid.
      - run: make test-backend TESTFLAGS='-count=1 ./...'
      - run: make backend
      - run: make test-skills

  frontend:
    runs-on: ubuntu-latest
    # Same pinned Arch snapshot as the release build (see release.yml): Qt 6.10,
    # so the floor check runs in the environment the tarball ships from.
    container:
      image: archlinux:base-20260315.0.500537
    steps:
      - run: |
          printf 'Server=https://archive.archlinux.org/repos/2026/03/15/$repo/os/$arch\n' >/etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed base-devel cmake ninja qt6-base qt6-declarative qt6-svg qt6-tools
      - uses: actions/checkout@v7
      - run: make test-frontend
      - run: make check-qt-floor GUI_BIN=frontend/build/omastore-gui
